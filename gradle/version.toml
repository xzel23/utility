[versions]
projectVersion = "24.2.1"
jdkVersion = "21"
javafxJdkVersion = "25"
atlantafx = "2.1.0"
bouncycastle = "1.85.2"
h2database = "2.4.240"
ikonli = "12.4.0"
jimfs = "1.3.1"
jspecify = "1.0.1"
junit-bom = "6.1.3"
log4j-bom = "2.26.1"
rtfparserkit = "1.16.0"
slb4j = "0.13.0"
slf4j = "2.0.18"
spotbugs = "4.10.3"

# Plugins
cabe-plugin = "4.5.0"
jdkprovider-plugin = "0.11.0"
jmh-plugin = "0.7.3"
jreleaser-plugin = "1.25.0"
native-plugin = "1.0.0"
sonar-plugin = "7.4.0.8496"
spotbugs-plugin = "6.5.10"
test-logger-plugin = "4.0.0"
versions-plugin = "0.60.0"

[libraries]
atlantafx = { group = "io.github.mkpaz", name = "atlantafx-base", version.ref = "atlantafx" }
bouncycastle-bom = { group = "org.bouncycastle", name = "bc-jdk18on-bom", version.ref = "bouncycastle" }
bouncycastle-pkix = { group = "org.bouncycastle", name = "bcpkix-jdk18on" }
bouncycastle-provider = { group = "org.bouncycastle", name = "bcprov-jdk18on" }
h2 = { group = "com.h2database", name = "h2", version.ref = "h2database" }
ikonli-bom = { group = "org.kordamp.ikonli", name = "ikonli-bom", version.ref = "ikonli" }
ikonli-fontawesome6 = { group = "org.kordamp.ikonli", name = "ikonli-fontawesome6-pack" }
ikonli-feather = { group = "org.kordamp.ikonli", name = "ikonli-feather-pack" }
ikonli-javafx = { group = "org.kordamp.ikonli", name = "ikonli-javafx" }
jimfs = { group = "com.google.jimfs", name = "jimfs", version.ref = "jimfs" }
jspecify = { group = "org.jspecify", name = "jspecify", version.ref = "jspecify" }
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit-bom" }
junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api" }
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
log4j-api = { group = "org.apache.logging.log4j", name = "log4j-api" }
log4j-bom = { group = "org.apache.logging.log4j", name = "log4j-bom", version.ref = "log4j-bom" }
rtfparserkit = { group = "com.github.joniles", name = "rtfparserkit", version.ref = "rtfparserkit" }
slb4j-bom = { group = "org.slb4j", name = "slb4j-bom", version.ref = "slb4j" }
slb4j = { group = "org.slb4j", name = "slb4j" }
slb4j-ext = { group = "org.slb4j", name = "slb4j-ext" }
slb4j-ext-fx = { group = "org.slb4j", name = "slb4j-ext-fx" }
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }
utility-bom = { group = "com.dua3.utility", name = "utility-bom", version.ref = "projectVersion" }
spotbugs-annotations = { group = "com.github.spotbugs", name = "spotbugs-annotations", version.ref = "spotbugs" }

[plugins]
cabe = { id = "com.dua3.cabe", version.ref = "cabe-plugin" }
jdk = { id = "com.dua3.gradle.jdkprovider", version.ref = "jdkprovider-plugin" }
jmh = { id = "me.champeau.jmh", version.ref = "jmh-plugin" }
jreleaser = { id = "org.jreleaser", version.ref = "jreleaser-plugin" }
native = { id = "org.graalvm.buildtools.native", version.ref = "native-plugin" }
sonar = { id = "org.sonarqube", version.ref = "sonar-plugin" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs-plugin" }
test-logger = { id = "com.adarshr.test-logger", version.ref = "test-logger-plugin" }
